<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria's Magic Farm - Kairosoft Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #87CEEB;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Sky with clouds */
        #sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E2FF 100%);
            z-index: -1;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 30s infinite linear;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 { width: 80px; height: 30px; top: 30px; left: -100px; }
        .cloud1::before { width: 40px; height: 40px; top: -15px; left: 20px; }
        .cloud1::after { width: 50px; height: 35px; top: -10px; right: 10px; }

        .cloud2 { width: 100px; height: 35px; top: 80px; left: -150px; animation-delay: -15s; }
        .cloud2::before { width: 50px; height: 45px; top: -18px; left: 25px; }
        .cloud2::after { width: 60px; height: 40px; top: -12px; right: 15px; }

        @keyframes float {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* Main container */
        #game {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            position: relative;
            z-index: 1;
        }

        /* Pixel art header */
        #header {
            background: linear-gradient(to bottom, #FF6B9D 0%, #FFA07A 100%);
            border: 4px solid #333;
            padding: 15px;
            text-align: center;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        #header h1 {
            color: white;
            text-shadow: 3px 3px 0 #333, -1px -1px 0 #FFD700;
            font-size: 28px;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
        }

        .version {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            text-shadow: 1px 1px 0 #333;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Main game area */
        #main-area {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 10px;
        }

        /* Panels */
        .panel {
            background: #FFF8DC;
            border: 4px solid #8B4513;
            padding: 10px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        .panel-title {
            background: #FF6347;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            border: 2px solid #333;
            margin: -10px -10px 10px -10px;
            text-shadow: 1px 1px 0 #333;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 2px dotted #DEB887;
            font-size: 11px;
        }

        .stat-value {
            font-weight: bold;
            color: #FF6347;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #32CD32;
            border: 3px solid #333;
            color: white;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            text-shadow: 1px 1px 0 #333;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #000;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .btn-red { background: #FF4444; }
        .btn-blue { background: #4169E1; }
        .btn-yellow { background: #FFD700; color: #333; }

        /* Farm area with pixel grass */
        #farm-container {
            background: #7CFC00;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
            padding: 20px;
            position: relative;
            min-height: 500px;
        }

        /* Farmhouse */
        #farmhouse {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
        }

        .house-roof {
            width: 0;
            height: 0;
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-bottom: 35px solid #DC143C;
            position: relative;
            left: -5px;
            filter: drop-shadow(2px 2px 0 #333);
        }

        .house-body {
            width: 80px;
            height: 45px;
            background: #DEB887;
            border: 3px solid #333;
            position: relative;
        }

        .house-door {
            width: 20px;
            height: 28px;
            background: #8B4513;
            border: 2px solid #333;
            position: absolute;
            bottom: 0;
            left: 30px;
        }

        .house-window {
            width: 15px;
            height: 15px;
            background: #87CEEB;
            border: 2px solid #333;
            position: absolute;
            top: 8px;
        }

        .house-window:first-of-type { left: 8px; }
        .house-window:last-of-type { right: 8px; }

        /* Character - Pixel art farmer */
        .character {
            position: absolute;
            width: 32px;
            height: 40px;
            transition: all 1.5s ease-in-out;
            z-index: 100;
        }

        .character-body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Head */
        .char-head {
            width: 12px;
            height: 12px;
            background: #FFE0BD;
            border: 2px solid #333;
            position: absolute;
            top: 0;
            left: 10px;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        /* Hat */
        .char-hat {
            width: 16px;
            height: 6px;
            border: 2px solid #333;
            position: absolute;
            top: -4px;
            left: 8px;
            border-radius: 2px 2px 0 0;
        }

        /* Hair for female characters */
        .char-hair {
            width: 14px;
            height: 8px;
            border: 2px solid #333;
            position: absolute;
            top: -3px;
            left: 9px;
            border-radius: 50% 50% 0 0;
        }

        /* Body */
        .char-torso {
            width: 16px;
            height: 12px;
            border: 2px solid #333;
            position: absolute;
            top: 14px;
            left: 8px;
        }

        /* Arms */
        .char-arm {
            width: 6px;
            height: 10px;
            background: #FFE0BD;
            border: 2px solid #333;
            position: absolute;
            top: 16px;
        }

        .char-arm.left { left: 4px; }
        .char-arm.right { right: 4px; }

        /* Legs */
        .char-leg {
            width: 6px;
            height: 10px;
            background: #654321;
            border: 2px solid #333;
            position: absolute;
            top: 28px;
        }

        .char-leg.left { left: 9px; }
        .char-leg.right { right: 9px; }

        /* Walking animation */
        @keyframes walk {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .character.walking .char-leg.left {
            animation: walk 0.4s infinite;
        }

        .character.walking .char-leg.right {
            animation: walk 0.4s infinite;
            animation-delay: 0.2s;
        }

        /* Emoji bubble */
        .emoji-bubble {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: white;
            border: 3px solid #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.3s;
            z-index: 101;
        }

        .emoji-bubble.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        /* Bubble tail */
        .emoji-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid white;
            filter: drop-shadow(1px 2px 0 #333);
        }

        /* Farm grid */
        #farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
            padding-top: 20px;
        }

        /* Plot - pixel art soil */
        .plot {
            width: 140px;
            height: 140px;
            background: #8B4513;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 6px),
                repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 6px);
            border: 4px solid #654321;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.1);
        }

        .plot:hover {
            transform: scale(1.05);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.1);
        }

        .plot.growing {
            background: #6B8E23;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 6px),
                repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 6px);
        }

        .plot.ready {
            background: #FFD700;
            animation: glow 1s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px #FFD700, 4px 4px 0 rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 20px #FFD700, 4px 4px 0 rgba(0,0,0,0.4); }
        }

        .plot-id {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 9px;
            color: rgba(255,255,255,0.5);
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .crop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .crop-icon {
            font-size: 50px;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
            animation: grow 0.5s;
        }

        @keyframes grow {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .crop-name {
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            margin-top: 5px;
        }

        .crop-status {
            font-size: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            margin-top: 3px;
        }

        .timer {
            font-size: 12px;
            font-weight: bold;
            background: #FF6347;
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            border: 2px solid #333;
            margin-top: 5px;
            text-shadow: 1px 1px 0 #000;
        }

        .timer.ready {
            background: #32CD32;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .empty-plot {
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            text-align: center;
            line-height: 140px;
            text-shadow: 1px 1px 0 #000;
        }

        /* Shop */
        .shop-item {
            background: white;
            border: 3px solid #333;
            padding: 8px;
            margin: 5px 0;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }

        .shop-item:hover {
            background: #FFFACD;
            transform: translateX(3px);
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .shop-name {
            font-weight: bold;
            font-size: 11px;
        }

        .shop-icon {
            font-size: 20px;
        }

        .shop-info {
            font-size: 9px;
            color: #666;
        }

        .shop-price {
            background: #FF4444;
            color: white;
            padding: 3px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 9px;
            margin-top: 5px;
        }

        /* Progress bar */
        .progress-container {
            margin: 10px 0;
        }

        .progress-bar {
            height: 20px;
            background: white;
            border: 3px solid #333;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #32CD32,
                #32CD32 10px,
                #228B22 10px,
                #228B22 20px
            );
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 10px;
            text-shadow: 1px 1px 0 #000;
        }

        /* Log */
        #log {
            max-height: 100px;
            overflow-y: auto;
            background: #FFFAF0;
            border: 3px solid #8B4513;
            padding: 8px;
            margin-top: 10px;
            font-size: 10px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px dotted #DEB887;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFF8DC;
            border: 5px solid #333;
            padding: 20px;
            max-width: 400px;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
        }

        .modal-header {
            background: #FF6347;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #333;
            margin: -20px -20px 15px -20px;
        }

        .close {
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        @media (max-width: 1000px) {
            #main-area { grid-template-columns: 1fr; }
            .plot { width: 100px; height: 100px; }
        }

        /* Season Summary Modal */
        #season-summary {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        #season-summary.show {
            display: flex;
        }

        .summary-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 6px solid #FFD700;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .summary-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
            animation: bounce 1s infinite;
        }

        .celebration {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 80px;
            margin: 30px 0;
            position: relative;
        }

        /* Pixel art workers high-fiving */
        .worker {
            position: relative;
            width: 60px;
            height: 80px;
        }

        .worker-head {
            width: 24px;
            height: 24px;
            background: #FFE0BD;
            border: 3px solid #333;
            position: absolute;
            top: 0;
            left: 18px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .worker-hat {
            width: 30px;
            height: 12px;
            border: 3px solid #333;
            position: absolute;
            top: -8px;
            left: 15px;
            border-radius: 3px 3px 0 0;
        }

        .worker.left .worker-hat { background: #4169E1; }
        .worker.right .worker-hat { background: #FF69B4; }

        .worker-body {
            width: 30px;
            height: 24px;
            border: 3px solid #333;
            position: absolute;
            top: 27px;
            left: 15px;
        }

        .worker.left .worker-body { background: #4169E1; }
        .worker.right .worker-body { background: #FF69B4; }

        .worker-arm {
            width: 12px;
            height: 20px;
            background: #FFE0BD;
            border: 3px solid #333;
            position: absolute;
            top: 30px;
        }

        .worker.left .worker-arm {
            left: 45px;
            transform: rotate(-45deg);
            transform-origin: top left;
        }

        .worker.right .worker-arm {
            right: 45px;
            transform: rotate(45deg);
            transform-origin: top right;
        }

        .worker-hand {
            width: 15px;
            height: 15px;
            background: #FFE0BD;
            border: 3px solid #333;
            border-radius: 50%;
            position: absolute;
            top: 20px;
        }

        .worker.left .worker-hand { right: -5px; }
        .worker.right .worker-hand { left: -5px; }

        .worker-legs {
            width: 12px;
            height: 20px;
            background: #654321;
            border: 3px solid #333;
            position: absolute;
            top: 54px;
        }

        .worker.left .worker-legs:nth-of-type(2) { left: 18px; }
        .worker.left .worker-legs:nth-of-type(3) { left: 30px; }
        .worker.right .worker-legs:nth-of-type(2) { right: 18px; }
        .worker.right .worker-legs:nth-of-type(3) { right: 30px; }

        /* High-five spark */
        .highfive-spark {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            animation: sparkle 0.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.3); opacity: 0.7; }
        }

        .summary-stats {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #FFF8DC;
            border: 3px solid #333;
            border-radius: 5px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            color: #333;
        }

        .stat-value {
            font-size: 18px;
            color: #FF6347;
        }

        .rest-timer {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(to bottom, #32CD32, #228B22);
            border: 4px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 0 #000;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #000;
        }

        .continue-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #000;
        }
    </style>
</head>
<body>
    <div id="sky">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div id="game">
        <div id="header">
            <h1>🌾 GLORIA'S MAGIC FARM 🌾</h1>
            <div class="version">v2.6 - GOAL IS ON RIGHT NOW! ✅</div>
        </div>

        <div id="main-area">
            <!-- Left Panel -->
            <div>
                <div class="panel">
                    <div class="panel-title">🧑‍🌾 FARMER</div>
                    <div class="stat-line">
                        <span>💰 Gold:</span>
                        <span class="stat-value" id="gold">1000</span>
                    </div>
                    <div class="stat-line">
                        <span>💎 Gems:</span>
                        <span class="stat-value" id="gems">10</span>
                    </div>
                    <div class="stat-line">
                        <span>⭐ EXP:</span>
                        <span class="stat-value" id="exp">0</span>
                    </div>
                </div>

                <div class="panel" style="margin-top:10px;">
                    <div class="panel-title">🌱 SEED SHOP</div>
                    <div id="seed-shop" style="max-height:400px;overflow-y:auto;"></div>
                </div>

                <div class="panel" style="margin-top:10px;">
                    <div class="panel-title">📅 CALENDAR</div>
                    <div class="stat-line">
                        <span>Date:</span>
                        <span id="date">May 1</span>
                    </div>
                    <div class="stat-line">
                        <span>Day:</span>
                        <span id="day">1</span>
                    </div>
                    <button class="btn btn-red" onclick="game.nextDay()">⏭️ NEXT DAY</button>
                </div>

                <div class="panel" style="margin-top:10px;">
                    <button class="btn btn-blue" onclick="game.waterAll()">💧 WATER</button>
                    <button class="btn btn-blue" onclick="game.fertAll()">🌱 FERTILIZE</button>
                    <button class="btn btn-yellow" onclick="game.harvestAll()">🌾 HARVEST</button>
                </div>
            </div>

            <!-- Farm Area -->

            <div>

                <div class="panel" style="margin-top:10px;">

                    <div id="goal-text" style="text-align:center;padding:10px;font-weight:bold;font-size:11px;background:#FFE4B5;border:2px solid #333;margin-bottom:10px;">
                        Loading...
                    </div>
                    <div id="progress-details" style="padding:5px 0;">
                        <!-- Progress bars will be inserted here -->
                    </div>

                <div class="panel" style="margin-top:10px;">
                    <div class="panel-title" style="background:#9370DB;">⭐ UPGRADES</div>

        <div id="log"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" onclick="closeModal()">&times;</span>
                <span id="modal-title">PLOT</span>

            <div id="modal-body"></div>

    </div>

    <!-- Season Summary -->
    <div id="season-summary">
        <div class="summary-content">
            <div class="summary-title" id="summary-title">🎉 SEASON COMPLETE! 🎉</div>

            <div class="celebration">
                <!-- Left Worker -->
                <div class="worker left">
                    <div class="worker-hat"></div>
                    <div class="worker-head"></div>
                    <div class="worker-body"></div>
                    <div class="worker-arm">
                        <div class="worker-hand"></div>
                    </div>
                    <div class="worker-legs"></div>
                    <div class="worker-legs"></div>
                </div>

                <!-- High-five spark -->
                <div class="highfive-spark">✨</div>

                <!-- Right Worker -->
                <div class="worker right">
                    <div class="worker-hat"></div>
                    <div class="worker-head"></div>
                    <div class="worker-body"></div>
                    <div class="worker-arm">
                        <div class="worker-hand"></div>
                    </div>
                    <div class="worker-legs"></div>
                    <div class="worker-legs"></div>
                </div>
            </div>

            <div class="summary-stats" id="summary-stats">
                <!-- Stats will be inserted here -->
            </div>

            <div class="rest-timer" id="rest-timer">
                Next season starts in: 30s
            </div>

            <button class="continue-btn" onclick="game.skipRest()">
                ⏩ START NEXT SEASON NOW
            </button>
        </div>
    </div>

    <script>
// Crops: type can be 'grain' (10s) or 'fruit' (15s)
const CROPS={
    Wheat:{name:"Wheat",icon:"🌾",price:10,time:10,yield:30,sell:5,type:"grain"},
    Carrot:{name:"Carrot",icon:"🥕",price:15,time:10,yield:20,sell:8,type:"grain"},
    Corn:{name:"Corn",icon:"🌽",price:20,time:10,yield:25,sell:10,type:"grain"},
    Tomato:{name:"Tomato",icon:"🍅",price:30,time:15,yield:10,sell:15,type:"fruit"},
    Strawberry:{name:"Strawberry",icon:"🍓",price:50,time:15,yield:15,sell:20,type:"fruit"},
    Watermelon:{name:"Watermelon",icon:"🍉",price:80,time:15,yield:8,sell:30,type:"fruit"},
    Apple:{name:"Apple",icon:"🍎",price:60,time:15,yield:12,sell:25,type:"fruit"},
    Pumpkin:{name:"Pumpkin",icon:"🎃",price:100,time:15,yield:5,sell:40,type:"fruit"}
};

const EMOJIS = ['😊', '🤔', '😴', '💪', '❤️', '💰', '🌾', '💦', '🎉', '✨', '🌟', '🌈'];

// Character configurations: [name, gender, shirt color, hat/hair color, hat/hair type]
const CHARACTERS = [
    {name: 'Tom', gender: 'male', shirt: '#4169E1', hat: '#FFD700', skin: '#FFE0BD'},
    {name: 'Lisa', gender: 'female', shirt: '#FF69B4', hair: '#8B4513', skin: '#FFE0BD'},
    {name: 'Bob', gender: 'male', shirt: '#32CD32', hat: '#DC143C', skin: '#F5DEB3'},
    {name: 'Anna', gender: 'female', shirt: '#9370DB', hair: '#FFD700', skin: '#FFDAB9'}
];

// Season goals - multi-crop combinations
const SEASON_GOALS = [
    // Easy goals (1-2 crops)
    {
        requirements: [
            {crop: 'Wheat', amount: 100}
        ],
        reward_gold: 500, reward_gems: 5
    },
    {
        requirements: [
            {crop: 'Carrot', amount: 80},
            {crop: 'Wheat', amount: 30}
        ],
        reward_gold: 700, reward_gems: 7
    },
    {
        requirements: [
            {crop: 'Tomato', amount: 50},
            {crop: 'Carrot', amount: 40}
        ],
        reward_gold: 800, reward_gems: 8
    },
    // Medium goals (2-3 crops)
    {
        requirements: [
            {crop: 'Wheat', amount: 50},
            {crop: 'Carrot', amount: 50},
            {crop: 'Corn', amount: 40}
        ],
        reward_gold: 900, reward_gems: 9
    },
    {
        requirements: [
            {crop: 'Carrot', amount: 50},
            {crop: 'Wheat', amount: 100},
            {crop: 'Apple', amount: 40}
        ],
        reward_gold: 1200, reward_gems: 12
    },
    {
        requirements: [
            {crop: 'Tomato', amount: 60},
            {crop: 'Strawberry', amount: 50}
        ],
        reward_gold: 1100, reward_gems: 11
    },
    // Hard goals (3-4 crops)
    {
        requirements: [
            {crop: 'Wheat', amount: 80},
            {crop: 'Carrot', amount: 60},
            {crop: 'Tomato', amount: 40},
            {crop: 'Corn', amount: 50}
        ],
        reward_gold: 1500, reward_gems: 15
    },
    {
        requirements: [
            {crop: 'Apple', amount: 50},
            {crop: 'Strawberry', amount: 60},
            {crop: 'Watermelon', amount: 30}
        ],
        reward_gold: 1800, reward_gems: 18
    },
    {
        requirements: [
            {crop: 'Corn', amount: 70},
            {crop: 'Tomato', amount: 50},
            {crop: 'Pumpkin', amount: 20}
        ],
        reward_gold: 1400, reward_gems: 14
    },
    {
        requirements: [
            {crop: 'Wheat', amount: 120},
            {crop: 'Carrot', amount: 80},
            {crop: 'Apple', amount: 60},
            {crop: 'Strawberry', amount: 40}
        ],
        reward_gold: 2000, reward_gems: 20
    }
];

const SEASON_TIME = 180; // 3 minutes in seconds

class Game{
    constructor(){
        this.gold=1000;this.gems=10;this.fame=50;this.exp=0;
        this.date=new Date(2024,4,1);this.day=1;
        this.plots=Array(9).fill().map((_,i)=>({id:i,crop:null,timer:null,remaining:0}));
        this.maxPlots=9;
        this.harvested={};
        this.plantedTypes=new Set();
        this.seasonStartGold=1000;
        this.seasonGoldEarned=0;
        this.characters=[];
        this.seasonTime=SEASON_TIME;
        this.seasonRemaining=SEASON_TIME;
        this.currentGoal=this.selectRandomGoal();
        this.isResting=false;
        this.restRemaining=30;
        this.seasonNumber=1;
        this.seedInventory={};
        this.speedBoosters=0;
        this.init();
    }
    selectRandomGoal(){
        const goal=SEASON_GOALS[Math.floor(Math.random()*SEASON_GOALS.length)];
        return JSON.parse(JSON.stringify(goal)); // Deep copy
    }

    startSeasonTimer(){
        this.seasonTimer=setInterval(()=>{
            this.seasonRemaining--;
            this.updateSeasonDisplay();
            if(this.seasonRemaining<=0){
                this.endSeason();
            }
        },1000);
    }

    updateSeasonDisplay(){
        const minutes=Math.floor(this.seasonRemaining/60);
        const seconds=this.seasonRemaining%60;
        const timeStr=minutes+':'+(seconds<10?'0':'')+seconds;
        document.getElementById('season-timer').textContent=timeStr;

        const progress=(1-(this.seasonRemaining/this.seasonTime))*100;
        const bar=document.getElementById('season-progress-bar');
        if(bar)bar.style.width=progress+'%';
    }

    init(){
        const g=document.getElementById('farm-grid');
        for(let i=0;i<9;i++){
            const p=document.createElement('div');
            p.className='plot';
            p.id='plot-'+i;
            p.innerHTML='<div class="plot-id">#'+i+'</div><div class="empty-plot">CLICK<br>TO PLANT</div>';
            p.onclick=()=>this.showModal(i);
            g.appendChild(p);
        }
        this.renderShop();
        this.renderSeedShop();
        this.createCharacters();
        this.render();
        this.startCharacterMovement();
        this.startSeasonTimer();
    }

    createCharacters() {
        const container = document.getElementById('characters-container');
        CHARACTERS.forEach((config, i) => {
            const char = document.createElement('div');
            char.className = 'character';
            char.id = 'character-' + i;

            const headStyle = config.gender === 'female' ? `background: ${config.skin}` : `background: ${config.skin}`;
            const topHead = config.gender === 'female'
                ? `<div class="char-hair" style="background: ${config.hair}"></div>`
                : `<div class="char-hat" style="background: ${config.hat}"></div>`;

            char.innerHTML = `
                <div class="emoji-bubble"></div>
                <div class="character-body">
                    ${topHead}
                    <div class="char-head" style="${headStyle}"></div>
                    <div class="char-torso" style="background: ${config.shirt}"></div>
                    <div class="char-arm left"></div>
                    <div class="char-arm right"></div>
                    <div class="char-leg left"></div>
                    <div class="char-leg right"></div>
                </div>
            `;

            // Random starting position
            char.style.left = (20 + i * 20) + '%';
            char.style.top = (30 + (i % 2) * 30) + '%';

            container.appendChild(char);

            this.characters.push({
                id: i,
                element: char,
                x: 20 + i * 20,
                y: 30 + (i % 2) * 30,
                moving: false,
                busy: false,
                name: config.name
            });
        });
    }

    startCharacterMovement() {
        // Each character moves independently
        this.characters.forEach((char, i) => {
            setInterval(() => {
                if (!char.moving && !char.busy) {
                    this.moveCharacter(i);
                }
            }, 3000 + i * 1000);

            // Random emoji showing
            setInterval(() => {
                if (!char.moving && !char.busy && Math.random() > 0.6) {
                    this.showEmoji(i);
                }
            }, 4000 + i * 1500);
        });

        // Check for ready crops every second
        setInterval(() => this.checkReadyCrops(), 1000);
    }

    moveCharacter(charIndex) {
        const char = this.characters[charIndex];
        const elem = char.element;

        const maxX = 80;
        const maxY = 80;
        const minX = 10;
        const minY = 20;

        const newX = Math.random() * (maxX - minX) + minX;
        const newY = Math.random() * (maxY - minY) + minY;

        char.x = newX;
        char.y = newY;
        char.moving = true;

        elem.classList.add('walking');
        elem.style.left = newX + '%';
        elem.style.top = newY + '%';

        setTimeout(() => {
            elem.classList.remove('walking');
            char.moving = false;
        }, 1500);
    }

    showEmoji(charIndex, emoji = null) {
        const char = this.characters[charIndex];
        const bubble = char.element.querySelector('.emoji-bubble');
        const selectedEmoji = emoji || EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

        bubble.textContent = selectedEmoji;
        bubble.classList.add('show');

        setTimeout(() => {
            bubble.classList.remove('show');
        }, 2000);
    }

    checkReadyCrops() {
        this.plots.forEach((plot, i) => {
            if (plot.crop && !plot.crop.harvesting && plot.remaining <= 0 && !plot.readyNotified) {
                plot.readyNotified = true;
                // Find an available character to harvest
                const availableChar = this.characters.find(c => !c.busy);
                if (availableChar) {
                    this.autoHarvest(i, this.characters.indexOf(availableChar));
                }
            }
        });
    }

    autoHarvest(plotId, charIndex) {
        const plot = this.plots[plotId];
        const char = this.characters[charIndex];

        if (!plot.crop || plot.crop.harvesting) return;

        plot.crop.harvesting = true;
        char.busy = true;

        // Move character to plot
        const plotElem = document.getElementById('plot-' + plotId);
        const rect = plotElem.getBoundingClientRect();
        const containerRect = document.getElementById('farm-container').getBoundingClientRect();

        const targetX = ((rect.left - containerRect.left) / containerRect.width) * 100;
        const targetY = ((rect.top - containerRect.top) / containerRect.height) * 100;

        char.x = targetX;
        char.y = targetY;
        char.moving = true;
        char.element.classList.add('walking');
        char.element.style.left = targetX + '%';
        char.element.style.top = targetY + '%';

        // After arrival, harvest
        setTimeout(() => {
            char.element.classList.remove('walking');
            char.moving = false;
            this.showEmoji(charIndex, '🌾');

            // Perform harvest after 1 second
            setTimeout(() => {
                this.harvest(plotId);
                char.busy = false;
                this.showEmoji(charIndex, '💰');
            }, 1000);
        }, 1500);
    }
    plant(name,pid){
        const c=CROPS[name];
        const p=this.plots[pid];
        if(p.crop)return alert('Plot occupied!');

        // Check if has seeds in inventory first
        if(this.seedInventory && this.seedInventory[name]>0){
            this.seedInventory[name]--;
            this.log('🌱 Used 1 '+name+' seed from inventory');
        }else{
            // Pay with gold
            if(this.gold<c.price)return alert('Not enough gold!');
            this.gold-=c.price;
        }

        p.crop={
            name:c.name,
            icon:c.icon,
            time:c.time,
            yield:c.yield,
            sell:c.sell,
            type:c.type,
            harvesting:false
        };
        p.remaining = c.time;
        p.readyNotified = false;

        // Track planted types for variety goal
        this.plantedTypes.add(name);

        this.log('✅ Planted '+c.name);

        // Find a random character to show planting emoji
        const randomChar = Math.floor(Math.random() * this.characters.length);
        this.showEmoji(randomChar, '🌱');

        // Start countdown timer
        if(p.timer) clearInterval(p.timer);
        p.timer = setInterval(() => {
            p.remaining--;
            if(p.remaining <= 0) {
                clearInterval(p.timer);
                p.timer = null;
            }
            this.render();
        }, 1000);

        this.render();
        closeModal();
    }
    harvest(pid){
        const p=this.plots[pid];
        if(!p.crop || p.remaining > 0) return;
        const c=p.crop;
        const amt=c.yield;
        const val=amt*c.sell;
        this.harvested[c.name]=(this.harvested[c.name]||0)+amt;
        this.gold+=val;
        this.seasonGoldEarned+=val;
        this.log('🌾 Harvested '+amt+' '+c.name+' (+'+val+'g)');

        // Clear plot
        if(p.timer) clearInterval(p.timer);
        p.crop=null;
        p.remaining=0;
        p.readyNotified=false;
        this.render();
    }
    waterAll(){
        this.log('💧 Watered all');
        const randomChar = Math.floor(Math.random() * this.characters.length);
        this.showEmoji(randomChar, '💦');
    }
    fertAll(){
        this.log('🌱 Fertilized all');
        const randomChar = Math.floor(Math.random() * this.characters.length);
        this.showEmoji(randomChar, '🌱');
    }
    harvestAll(){
        let n=0;
        this.plots.forEach((_,i)=>{
            const p=this.plots[i];
            if(p.crop && p.remaining <= 0 && !p.crop.harvesting){
                const availableChar = this.characters.find(c => !c.busy);
                if (availableChar) {
                    this.autoHarvest(i, this.characters.indexOf(availableChar));
                    n++;
                }
            }
        });
        if(n){
            this.log('🎉 Harvesting '+n+' plots');
        }
    }
    getGoalProgress(){
        const goal=this.currentGoal;
        // Return array of progress for each requirement
        return goal.requirements.map(req => ({
            crop: req.crop,
            current: this.harvested[req.crop] || 0,
            target: req.amount,
            completed: (this.harvested[req.crop] || 0) >= req.amount
        }));
    }

    isGoalComplete(){
        const progress = this.getGoalProgress();
        return progress.every(p => p.completed);
    }

    getGoalDescription(){
        const goal = this.currentGoal;
        return goal.requirements.map(req =>
            `${req.amount} ${CROPS[req.crop].icon} ${req.crop}`
        ).join(' + ');
    }

    endSeason(){
        clearInterval(this.seasonTimer);
        const progress=this.getGoalProgress();
        const goal=this.currentGoal;
        const success=this.isGoalComplete();

        // Show summary modal
        this.showSeasonSummary(success, progress, goal);

        if(success){
            this.gold+=goal.reward_gold;
            this.gems+=goal.reward_gems;
            // Award EXP based on goal difficulty
            const expReward=Math.floor(goal.reward_gold/10);
            this.exp+=expReward;
            this.showEmoji(0,'🎉');
            this.log('🎉 Season '+this.seasonNumber+' completed! +'+expReward+' EXP');
        }else{
            this.showEmoji(0,'😢');
            this.log('💔 Season '+this.seasonNumber+' failed');
        }

        // Start 30 second rest period
        this.isResting=true;
        this.restRemaining=30;
        this.startRestTimer();
    }

    showSeasonSummary(success, progress, goal){
        const modal=document.getElementById('season-summary');
        const title=document.getElementById('summary-title');
        const stats=document.getElementById('summary-stats');

        // Set title
        title.textContent=success?'🎉 SEASON '+this.seasonNumber+' SUCCESS! 🎉':'💔 SEASON '+this.seasonNumber+' INCOMPLETE 💔';
        title.style.color=success?'#FFD700':'#FF6347';

        // Build stats HTML
        let statsHtml='';

        // Goal progress
        statsHtml+='<h3 style="text-align:center;margin-bottom:15px;color:#333;">📊 Goal Progress</h3>';
        progress.forEach(p=>{
            const icon=p.completed?'✅':'❌';
            const color=p.completed?'#32CD32':'#FF6347';
            statsHtml+=`<div class="stat-item">
                <span class="stat-label">${icon} ${CROPS[p.crop].icon} ${p.crop}</span>
                <span class="stat-value" style="color:${color}">${p.current}/${p.target}</span>
            </div>`;
        });

        // Rewards
        if(success){
            const expReward=Math.floor(goal.reward_gold/10);
            statsHtml+='<h3 style="text-align:center;margin:15px 0;color:#333;">🎁 Rewards</h3>';
            statsHtml+=`<div class="stat-item">
                <span class="stat-label">💰 Gold Earned</span>
                <span class="stat-value" style="color:#FFD700">+${goal.reward_gold}</span>
            </div>`;
            statsHtml+=`<div class="stat-item">
                <span class="stat-label">💎 Gems Earned</span>
                <span class="stat-value" style="color:#00CED1">+${goal.reward_gems}</span>
            </div>`;
            statsHtml+=`<div class="stat-item">
                <span class="stat-label">⭐ EXP Earned</span>
                <span class="stat-value" style="color:#9370DB">+${expReward}</span>
            </div>`;
        }

        // Season statistics
        statsHtml+='<h3 style="text-align:center;margin:15px 0;color:#333;">📈 Season Statistics</h3>';
        const totalHarvested=Object.values(this.harvested).reduce((a,b)=>a+b,0);
        statsHtml+=`<div class="stat-item">
            <span class="stat-label">🌾 Total Harvested</span>
            <span class="stat-value">${totalHarvested}</span>
        </div>`;
        statsHtml+=`<div class="stat-item">
            <span class="stat-label">💰 Gold This Season</span>
            <span class="stat-value">+${this.seasonGoldEarned}g</span>
        </div>`;
        statsHtml+=`<div class="stat-item">
            <span class="stat-label">🌱 Crop Types Planted</span>
            <span class="stat-value">${this.plantedTypes.size}</span>
        </div>`;

        stats.innerHTML=statsHtml;

        // Show modal
        modal.classList.add('show');
    }

    startRestTimer(){
        this.restTimer=setInterval(()=>{
            this.restRemaining--;
            document.getElementById('rest-timer').textContent=
                'Next season starts in: '+this.restRemaining+'s';

            if(this.restRemaining<=0){
                this.startNextSeason();
            }
        },1000);
    }

    skipRest(){
        if(!this.isResting)return;
        clearInterval(this.restTimer);
        this.startNextSeason();
    }

    startNextSeason(){
        clearInterval(this.restTimer);
        this.isResting=false;

        // Hide summary modal
        document.getElementById('season-summary').classList.remove('show');

        // Reset for new season
        this.seasonNumber++;
        this.harvested={};
        this.plantedTypes=new Set();
        this.seasonGoldEarned=0;
        this.seasonStartGold=this.gold;
        this.seasonRemaining=SEASON_TIME;
        this.restRemaining=30;
        this.currentGoal=this.selectRandomGoal();

        this.render();
        this.startSeasonTimer();

        this.log('🌟 Season '+this.seasonNumber+' started!');
    }

    nextDay(){
        this.date=new Date(this.date.getTime()+86400000);
        this.day++;
        this.log('📅 Day '+this.day);
        this.render();
    }
    buyWorker(){
        const cost=50*(this.characters.length-3);
        if(this.exp<cost){
            alert('Not enough EXP! Need '+cost+' EXP');
            return;
        }

        this.exp-=cost;

        // Create new worker with random appearance
        const colors=[
            {shirt:'#FF6347',hat:'#FFD700',gender:'male'},
            {shirt:'#32CD32',hat:'#FF69B4',gender:'female'},
            {shirt:'#FFA500',hat:'#8B4513',gender:'male'},
            {shirt:'#00CED1',hat:'#9370DB',gender:'female'}
        ];
        const config=colors[Math.floor(Math.random()*colors.length)];
        config.name='Worker'+(this.characters.length+1);
        config.skin='#FFE0BD';

        const id=this.characters.length;
        const char=document.createElement('div');
        char.className='character';
        char.id='character-'+id;

        const topHead=config.gender==='female'
            ?`<div class="char-hair" style="background:${config.hat}"></div>`
            :`<div class="char-hat" style="background:${config.hat}"></div>`;

        char.innerHTML=`
            <div class="emoji-bubble"></div>
            <div class="character-body">
                ${topHead}
                <div class="char-head" style="background:${config.skin}"></div>
                <div class="char-torso" style="background:${config.shirt}"></div>
                <div class="char-arm left"></div>
                <div class="char-arm right"></div>
                <div class="char-leg left"></div>
                <div class="char-leg right"></div>
            </div>
        `;

        char.style.left=(20+id*15)+'%';
        char.style.top=(30+(id%2)*20)+'%';

        document.getElementById('characters-container').appendChild(char);

        this.characters.push({
            id:id,
            element:char,
            x:20+id*15,
            y:30+(id%2)*20,
            moving:false,
            busy:false,
            name:config.name
        });

        this.log('✅ Hired '+config.name+'!');
        this.render();
        this.renderShop();
        this.renderSeedShop();
    }

    buyPlots(){
        const cost=100*(Math.floor((this.maxPlots-9)/3)+1);
        if(this.exp<cost){
            alert('Not enough EXP! Need '+cost+' EXP');
            return;
        }

        this.exp-=cost;
        this.maxPlots+=3;

        // Add 3 new plots
        const grid=document.getElementById('farm-grid');
        const currentCols=Math.ceil(Math.sqrt(this.maxPlots));
        grid.style.gridTemplateColumns=`repeat(${currentCols}, 1fr)`;

        for(let i=0;i<3;i++){
            const pid=this.plots.length;
            const p=document.createElement('div');
            p.className='plot';
            p.id='plot-'+pid;
            p.innerHTML='<div class="plot-id">#'+pid+'</div><div class="empty-plot">CLICK<br>TO PLANT</div>';
            p.onclick=()=>this.showModal(pid);
            grid.appendChild(p);

            this.plots.push({id:pid,crop:null,timer:null,remaining:0});
        }

        this.log('✅ Expanded farm! +3 plots');
        this.render();
        this.renderShop();
        this.renderSeedShop();
    }

    buySeedPack(cropName){
        const cost=30;
        if(this.exp<cost){
            alert('Not enough EXP! Need '+cost+' EXP');
            return;
        }

        this.exp-=cost;

        // Add seeds to inventory (free planting)
        if(!this.seedInventory)this.seedInventory={};
        this.seedInventory[cropName]=(this.seedInventory[cropName]||0)+5;

        this.log('✅ Bought 5 '+cropName+' seeds!');
        this.render();
        this.renderShop();
        this.renderSeedShop();
    }

    buySpeedBooster(){
        const cost=20;
        if(this.exp<cost){
            alert('Not enough EXP! Need '+cost+' EXP');
            return;
        }

        this.exp-=cost;
        this.speedBoosters++;

        this.log('✅ Bought Speed Booster! ⚡');
        this.render();
        this.renderShop();
        this.renderSeedShop();
    }

    useSpeedBooster(plotId){
        if(this.speedBoosters<=0){
            alert('No speed boosters available!');
            return;
        }

        const plot=this.plots[plotId];
        if(!plot.crop || plot.remaining<=0){
            alert('No growing crop on this plot!');
            return;
        }

        this.speedBoosters--;
        plot.remaining=Math.max(0, plot.remaining-10);

        this.log('⚡ Used Speed Booster! -10s on plot #'+plotId);
        this.render();
        this.renderShop();
        this.renderSeedShop();
        closeModal();
    }

    render(){
        document.getElementById('gold').textContent=this.gold;
        document.getElementById('gems').textContent=this.gems;
        document.getElementById('exp').textContent=this.exp;
        const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        document.getElementById('date').textContent=m[this.date.getMonth()]+' '+this.date.getDate();
        document.getElementById('day').textContent=this.day;

        // Update goal display - show description
        document.getElementById('goal-text').textContent=this.getGoalDescription();

        // Update progress display - show detailed progress for each crop
        const progressArray=this.getGoalProgress();
        let progressHtml = '';
        progressArray.forEach(p => {
            const pct = Math.min(100, (p.current / p.target) * 100);
            const color = p.completed ? '#32CD32' : '#FF6347';
            const icon = p.completed ? '✅' : '⏳';
            progressHtml += `<div style="margin:5px 0;">`;
            progressHtml += `<div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px;">`;
            progressHtml += `<span>${icon} ${CROPS[p.crop].icon} ${p.crop}</span>`;
            progressHtml += `<span style="font-weight:bold;">${p.current}/${p.target}</span>`;
            progressHtml += `</div>`;
            progressHtml += `<div style="height:8px;background:white;border:2px solid #333;">`;
            progressHtml += `<div style="height:100%;width:${pct}%;background:${color};transition:width 0.3s;"></div>`;
            progressHtml += `</div>`;
            progressHtml += `</div>`;
        });
        document.getElementById('progress-details').innerHTML = progressHtml;

        this.plots.forEach((p,i)=>{
            const d=document.getElementById('plot-'+i);
            if(p.crop){
                const rdy=p.remaining <= 0;
                d.className='plot '+(rdy?'ready':'growing');

                const timerHtml = rdy
                    ? '<div class="timer ready">✅ READY!</div>'
                    : '<div class="timer">⏰ '+p.remaining+'s</div>';

                d.innerHTML='<div class="plot-id">#'+i+'</div><div class="crop"><div class="crop-icon">'+p.crop.icon+'</div><div class="crop-name">'+p.crop.name+'</div>'+timerHtml+'</div>';
            }else{
                d.className='plot';
                d.innerHTML='<div class="plot-id">#'+i+'</div><div class="empty-plot">CLICK<br>TO PLANT</div>';
            }
        });
    }
    renderShop(){
        const s=document.getElementById('shop');
        s.innerHTML = ''; // Clear existing content

        // Speed Booster item
        const boosterDiv=document.createElement('div');
        boosterDiv.className='shop-item';
        boosterDiv.innerHTML='<div class="shop-header"><span class="shop-name">⚡ Speed Booster</span><span class="shop-icon" style="font-size:30px;">⚡</span></div><div class="shop-info">Reduce 10s growth time | Own: '+this.speedBoosters+'</div><div class="shop-price" style="background:#FF6347;">⭐ 20 EXP</div>';
        boosterDiv.onclick=()=>this.buySpeedBooster();
        s.appendChild(boosterDiv);

        // Worker upgrade
        const workerCost=50*(this.characters.length-3);
        const workerDiv=document.createElement('div');
        workerDiv.className='shop-item';
        workerDiv.innerHTML='<div class="shop-header"><span class="shop-name">👷 Hire Worker</span><span class="shop-icon" style="font-size:30px;">🧑‍🌾</span></div><div class="shop-info">Add one more worker to help harvest crops</div><div class="shop-price" style="background:#9370DB;">⭐ '+workerCost+' EXP</div>';
        workerDiv.onclick=()=>this.buyWorker();
        s.appendChild(workerDiv);

        // Plot upgrade
        const plotCost=100*(Math.floor((this.maxPlots-9)/3)+1);
        const plotDiv=document.createElement('div');
        plotDiv.className='shop-item';
        plotDiv.innerHTML='<div class="shop-header"><span class="shop-name">🌾 Expand Farm</span><span class="shop-icon" style="font-size:30px;">🏞️</span></div><div class="shop-info">Add 3 more farm plots to grow more crops</div><div class="shop-price" style="background:#9370DB;">⭐ '+plotCost+' EXP</div>';
        plotDiv.onclick=()=>this.buyPlots();
        s.appendChild(plotDiv);
    }

    renderSeedShop(){
        const s=document.getElementById('seed-shop');
        s.innerHTML = ''; // Clear existing content

        const seedCost=30;
        for(const[name,crop]of Object.entries(CROPS)){
            const d=document.createElement('div');
            d.className='shop-item';
            const owned = (this.seedInventory && this.seedInventory[name]) || 0;
            d.innerHTML='<div class="shop-header"><span class="shop-name">'+crop.icon+' '+name+'</span><span class="shop-icon" style="font-size:20px;">'+crop.icon+'</span></div><div class="shop-info">Get 5 free seeds | Own: '+owned+'</div><div class="shop-price" style="background:#9370DB;">⭐ '+seedCost+' EXP</div>';
            d.onclick=()=>this.buySeedPack(name);
            s.appendChild(d);
        }
    }
    showModal(pid){
        const p=this.plots[pid];
        const m=document.getElementById('modal');
        const b=document.getElementById('modal-body');
        const t=document.getElementById('modal-title');
        t.textContent='PLOT #'+pid;
        if(p.crop){
            const rdy=p.remaining <= 0;
            const typeLabel = p.crop.type === 'grain' ? '🌾 Grain' : '🍎 Fruit';
            let buttonsHtml='';
            if(rdy){
                buttonsHtml='<button class="btn btn-yellow" onclick="game.harvest('+pid+');closeModal();">🌾 MANUAL HARVEST</button>';
            }else{
                buttonsHtml='<button class="btn btn-blue" onclick="closeModal();">⏳ WAIT FOR AUTO-HARVEST</button>';
                // Add speed booster button if available and crop is still growing
                if(this.speedBoosters>0){
                    buttonsHtml+='<button class="btn" style="background:#FF6347;margin-top:5px;" onclick="game.useSpeedBooster('+pid+');">⚡ USE SPEED BOOSTER (-10s)</button>';
                    buttonsHtml+='<div style="text-align:center;font-size:10px;margin-top:5px;color:#666;">You have '+this.speedBoosters+' booster(s)</div>';
                }
            }
            b.innerHTML='<div style="text-align:center;margin:20px 0;"><div style="font-size:60px;">'+p.crop.icon+'</div><h3>'+p.crop.name+'</h3></div>'
            +'<div class="stat-line"><span>Type:</span><span>'+typeLabel+'</span></div>'
            +'<div class="stat-line"><span>Time:</span><span>'+p.crop.time+' seconds</span></div>'
            +'<div class="stat-line"><span>Status:</span><span>'+(rdy?'✅ READY':'⏰ '+p.remaining+' seconds remaining')+'</span></div>'
            +'<div style="margin-top:15px;">'+buttonsHtml+'</div>';
        }else{
            b.innerHTML='<p style="text-align:center;margin:20px 0;">Choose a crop to plant:</p><div id="crops"></div>';
            const cr=document.getElementById('crops');
            for(const[n,c]of Object.entries(CROPS)){
                const bt=document.createElement('button');
                bt.className='btn';
                const typeIcon = c.type === 'grain' ? '🌾' : '🍎';
                bt.textContent=c.icon+' '+n+' ('+c.price+'g, '+c.time+'s) '+typeIcon;
                bt.onclick=()=>this.plant(n,pid);
                cr.appendChild(bt);
            }
        }
        m.style.display='block';
    }
    log(msg){
        const l=document.getElementById('log');
        const e=document.createElement('div');
        e.className='log-entry';
        e.textContent=msg;
        l.insertBefore(e,l.firstChild);
        while(l.children.length>10)l.removeChild(l.lastChild);
    }
}

function closeModal(){document.getElementById('modal').style.display='none';}
window.onclick=e=>{
    if(e.target.id==='modal')closeModal();
};

let game;
window.onload=()=>{game=new Game();game.log('🎮 Welcome to Gloria\'s Magic Farm!');game.log('💡 Plant crops and reach your goals!');};
    </script>
</body>
</html>
